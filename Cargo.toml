[package]
name = "sqlbinder"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
thiserror = "2"
secrecy = "0.10"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "sqlite"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
